name: Build HotspotOS Test v1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create HotspotOS custom stage
        shell: bash
        run: |
          set -e

          mkdir -p custom-stage/00-hotspot-packages
          mkdir -p custom-stage/01-hotspot/files/usr/local/hotspotos
          mkdir -p custom-stage/01-hotspot/files/etc/hotspotos
          mkdir -p custom-stage/01-hotspot/files/etc/hostapd
          mkdir -p custom-stage/01-hotspot/files/etc/dnsmasq.d
          mkdir -p custom-stage/01-hotspot/files/etc/systemd/system
          mkdir -p custom-stage/01-hotspot/files/etc/nftables.d

          cat > custom-stage/00-hotspot-packages/00-packages <<'EOF'
          hostapd
          dnsmasq
          nftables
          python3
          python3-flask
          sqlite3
          iw
          rfkill
          curl
          EOF

          cat > custom-stage/01-hotspot/00-run.sh <<'EOF'
          #!/bin/bash
          set -e

          install -d /var/lib/hotspotos
          install -d /etc/hotspotos

          cat > /etc/hotspotos/config.json <<'CONFIG'
          {
            "ssid": "HotspotOS-Test",
            "gateway": "10.10.0.1",
            "interface": "wlan0",
            "wan": "eth0",
            "default_minutes": 60,
            "default_rate": 10
          }
          CONFIG

          cat > /etc/hostapd/hostapd.conf <<'EOF2'
          interface=wlan0
          driver=nl80211
          ssid=HotspotOS-Test
          hw_mode=g
          channel=6
          country_code=PH
          ieee80211n=1
          wmm_enabled=1
          auth_algs=1
          wpa=2
          wpa_passphrase=HotspotTest123
          wpa_key_mgmt=WPA-PSK
          rsn_pairwise=CCMP
          EOF2

          cat > /etc/default/hostapd <<'EOF2'
          DAEMON_CONF="/etc/hostapd/hostapd.conf"
          EOF2

          cat > /etc/dnsmasq.d/hotspotos.conf <<'EOF2'
          interface=wlan0
          bind-dynamic
          dhcp-range=10.10.0.20,10.10.0.250,255.255.255.0,12h
          dhcp-option=3,10.10.0.1
          dhcp-option=6,10.10.0.1
          address=/#/10.10.0.1
          EOF2

          cat > /usr/local/hotspotos/portal.py <<'PY'
          from flask import Flask, request, redirect
          import sqlite3
          import secrets
          import time
          import os

          DB = "/var/lib/hotspotos/hotspot.db"

          app = Flask(__name__)

          def database():
              os.makedirs("/var/lib/hotspotos", exist_ok=True)
              con = sqlite3.connect(DB)
              con.execute("""
                  CREATE TABLE IF NOT EXISTS tickets (
                      id INTEGER PRIMARY KEY AUTOINCREMENT,
                      code TEXT UNIQUE NOT NULL,
                      minutes INTEGER NOT NULL,
                      rate REAL NOT NULL,
                      created INTEGER NOT NULL,
                      expires INTEGER DEFAULT 0,
                      used INTEGER DEFAULT 0,
                      device TEXT DEFAULT ''
                  )
              """)
              con.execute("""
                  CREATE TABLE IF NOT EXISTS settings (
                      key TEXT PRIMARY KEY,
                      value TEXT NOT NULL
                  )
              """)
              con.execute(
                  "INSERT OR IGNORE INTO settings(key,value) VALUES('admin_password','admin')"
              )
              con.execute(
                  "INSERT OR IGNORE INTO settings(key,value) VALUES('force_password_change','1')"
              )
              con.commit()
              return con

          def html(body):
              return f"""
              <!doctype html>
              <html>
              <head>
                <meta name="viewport" content="width=device-width,initial-scale=1">
                <title>HotspotOS</title>
                <style>
                  *{{box-sizing:border-box}}
                  body{{margin:0;background:#101522;color:#fff;font-family:Arial,sans-serif}}
                  .box{{max-width:430px;margin:45px auto;padding:28px;background:#1d2636;border-radius:20px}}
                  h1{{text-align:center}}
                  input,button{{width:100%;padding:14px;margin:7px 0;border-radius:10px;border:0}}
                  button{{background:#168cff;color:white;font-weight:bold}}
                  .small{{opacity:.7;text-align:center}}
                  table{{width:100%;font-size:12px}}
                  td,th{{padding:5px}}
                  a{{color:#61b3ff}}
                </style>
              </head>
              <body>
                <div class="box">
                  {body}
                </div>
              </body>
              </html>
              """

          @app.route("/")
          def portal():
              return html("""
                <h1>📶 HotspotOS</h1>
                <p class="small">Internet Access Portal</p>
                <form method="post" action="/login">
                  <input name="code" placeholder="Enter Ticket Code" required autofocus>
                  <button>CONNECT</button>
                </form>
                <p class="small">Enter your valid access ticket.</p>
              """)

          @app.post("/login")
          def login():
              code = request.form.get("code","").strip().upper()

              con = database()
              row = con.execute(
                  "SELECT id,minutes,used FROM tickets WHERE code=?",
                  (code,)
              ).fetchone()

              if not row:
                  return html("<h2>❌ Invalid Ticket</h2><a href='/'>Back</a>")

              if row[2]:
                  return html("<h2>⚠️ Ticket Already Used</h2><a href='/'>Back</a>")

              now = int(time.time())
              expires = now + (int(row[1]) * 60)

              con.execute(
                  "UPDATE tickets SET used=1,expires=?,device=? WHERE id=?",
                  (expires, request.remote_addr or "", row[0])
              )
              con.commit()

              return html(f"""
                <h2>✅ Connected</h2>
                <p>Access time: <b>{row[1]} minutes</b></p>
                <p>Your session has started.</p>
              """)

          @app.route("/admin", methods=["GET","POST"])
          def admin():
              con = database()

              if request.method == "POST":
                  password = request.form.get("password","")

                  saved = con.execute(
                      "SELECT value FROM settings WHERE key='admin_password'"
                  ).fetchone()

                  if not saved or password != saved[0]:
                      return html("""
                        <h2>❌ Login failed</h2>
                        <a href="/admin">Try again</a>
                      """)

                  force = con.execute(
                      "SELECT value FROM settings WHERE key='force_password_change'"
                  ).fetchone()

                  if force and force[0] == "1":
                      return html("""
                        <h2>🔐 Change Admin Password</h2>
                        <form method="post" action="/admin/change-password">
                          <input name="old" type="password" placeholder="Current password" required>
                          <input name="new" type="password" placeholder="New password" required>
                          <input name="confirm" type="password" placeholder="Confirm password" required>
                          <button>CHANGE PASSWORD</button>
                        </form>
                      """)

              rows = con.execute(
                  "SELECT code,minutes,rate,used FROM tickets ORDER BY id DESC"
              ).fetchall()

              table = "".join(
                  f"<tr><td>{r[0]}</td><td>{r[1]}</td><td>{r[2]}</td><td>{'USED' if r[3] else 'READY'}</td></tr>"
                  for r in rows
              )

              return html(f"""
                <h1>⚙️ Admin</h1>

                <form method="post" action="/admin/generate">
                  <input name="minutes" type="number" value="60" min="1">
                  <input name="rate" type="number" value="10" min="0">
                  <input name="admin_password" type="password" placeholder="Admin password" required>
                  <button>GENERATE TICKET</button>
                </form>

                <hr>

                <table>
                  <tr>
                    <th>Code</th>
                    <th>Min</th>
                    <th>Rate</th>
                    <th>Status</th>
                  </tr>
                  {table}
                </table>
              """)

          @app.post("/admin/change-password")
          def change_password():
              con = database()

              old = request.form.get("old","")
              new = request.form.get("new","")
              confirm = request.form.get("confirm","")

              saved = con.execute(
                  "SELECT value FROM settings WHERE key='admin_password'"
              ).fetchone()

              if not saved or old != saved[0]:
                  return html("<h2>❌ Wrong current password</h2>")

              if len(new) < 6:
                  return html("<h2>❌ Password must be at least 6 characters</h2>")

              if new != confirm:
                  return html("<h2>❌ Passwords do not match</h2>")

              con.execute(
                  "UPDATE settings SET value=? WHERE key='admin_password'",
                  (new,)
              )
              con.execute(
                  "UPDATE settings SET value='0' WHERE key='force_password_change'"
              )
              con.commit()

              return html("""
                <h2>✅ Password Changed</h2>
                <p>Your new admin password is active.</p>
                <a href="/admin">Continue</a>
              """)

          @app.post("/admin/generate")
          def generate():
              con = database()

              password = request.form.get("admin_password","")

              saved = con.execute(
                  "SELECT value FROM settings WHERE key='admin_password'"
              ).fetchone()

              if not saved or password != saved[0]:
                  return html("<h2>❌ Invalid admin password</h2>")

              minutes = max(1, int(request.form.get("minutes",60)))
              rate = float(request.form.get("rate",10))

              code = secrets.token_hex(3).upper()

              con.execute(
                  """
                  INSERT INTO tickets(code,minutes,rate,created)
                  VALUES(?,?,?,?)
                  """,
                  (code,minutes,rate,int(time.time()))
              )
              con.commit()

              return html(f"""
                <h2>🎟️ Ticket Generated</h2>
                <h1>{code}</h1>
                <p>{minutes} minutes</p>
                <p>Rate: {rate}</p>
                <a href="/admin">Back to Admin</a>
              """)

          if __name__ == "__main__":
              database()
              app.run(host="127.0.0.1", port=8080)
          PY

          cat > /etc/systemd/system/hotspotos-portal.service <<'EOF2'
          [Unit]
          Description=HotspotOS Captive Portal
          After=network.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/python3 /usr/local/hotspotos/portal.py
          Restart=always
          RestartSec=2

          [Install]
          WantedBy=multi-user.target
          EOF2

          cat > /etc/systemd/system/hotspotos-network.service <<'EOF2'
          [Unit]
          Description=HotspotOS WiFi Network
          After=network-pre.target
          Before=hostapd.service dnsmasq.service
          Wants=network-pre.target

          [Service]
          Type=oneshot
          ExecStart=/bin/bash -c 'ip addr flush dev wlan0 || true; ip addr add 10.10.0.1/24 dev wlan0; ip link set wlan0 up'
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
          EOF2

          cat > /etc/nftables.d/hotspotos.nft <<'EOF2'
          table ip hotspotos_nat {
              chain postrouting {
                  type nat hook postrouting priority 100;
                  oifname "eth0" masquerade
              }
          }

          table ip hotspotos_filter {
              chain forward {
                  type filter hook forward priority 0;
                  iifname "wlan0" oifname "eth0" accept
                  iifname "eth0" oifname "wlan0" ct state established,related accept
              }
          }
          EOF2

          cat > /etc/systemd/system/hotspotos-firewall.service <<'EOF2'
          [Unit]
          Description=HotspotOS Firewall and NAT
          After=network.target

          [Service]
          Type=oneshot
          ExecStart=/bin/bash -c 'sysctl -w net.ipv4.ip_forward=1; nft -f /etc/nftables.d/hotspotos.nft'
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
          EOF2

          cat > /etc/sysctl.d/99-hotspotos.conf <<'EOF2'
          net.ipv4.ip_forward=1
          EOF2

          systemctl enable hotspotos-network.service
          systemctl enable hotspotos-firewall.service
          systemctl enable hotspotos-portal.service
          systemctl enable hostapd.service
          systemctl enable dnsmasq.service

          chmod +x /usr/local/hotspotos/portal.py
          EOF

          chmod +x custom-stage/01-hotspot/00-run.sh

          touch custom-stage/EXPORT_IMAGE

      - name: Build Raspberry Pi OS Lite 32-bit
        uses: usimd/pi-gen-action@v1
        with:
          image-name: HotspotOS-Test-v1
          stage-list: stage0 stage1 stage2 ./custom-stage
          compression: zip
          compression-level: 6
          export-last-stage-only: true
          enable-cloud-init: 0
          enable-ssh: 1
          username: admin
          password: admin
          disable-first-boot-user-rename: 1
          timezone: Asia/Manila
          wpa-country: PH
          verbose-output: true

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: HotspotOS-Test-v1
          path: pi-gen/deploy/*
          if-no-files-found: error
          retention-days: 7
