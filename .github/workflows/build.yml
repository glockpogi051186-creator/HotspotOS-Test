name: Build HotspotOS Test v4

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install host dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            coreutils \
            quilt \
            parted \
            qemu-user-binfmt \
            debootstrap \
            zerofree \
            zip \
            dosfstools \
            e2fsprogs \
            libarchive-tools \
            libcap2-bin \
            grep \
            rsync \
            xz-utils \
            file \
            git \
            curl \
            bc \
            gpg \
            pigz \
            xxd \
            arch-test \
            bmap-tools \
            kmod

          sudo update-binfmts --enable || true

      - name: Create HotspotOS custom stage
        shell: bash
        run: |
          set -eux

          rm -rf custom-stage

          mkdir -p custom-stage/01-hotspot

          cat > custom-stage/01-hotspot/00-run.sh <<'EOF'
          #!/bin/bash -e

          echo "================================="
          echo " HotspotOS Test v4"
          echo " Custom stage running"
          echo "================================="

          mkdir -p "${ROOTFS_DIR}/etc/hotspotos"

          echo "HotspotOS Test v4" \
            > "${ROOTFS_DIR}/etc/hotspotos/version"
          EOF

          chmod +x custom-stage/01-hotspot/00-run.sh

          touch custom-stage/EXPORT_IMAGE

      - name: Download official pi-gen
        shell: bash
        run: |
          set -eux

          rm -rf pi-gen

          git clone \
            --depth 1 \
            --branch master \
            https://github.com/RPi-Distro/pi-gen.git \
            pi-gen

      - name: Prepare pi-gen configuration
        shell: bash
        run: |
          set -eux

          cd pi-gen

          cat > config <<'EOF'
          IMG_NAME='HotspotOS-Test-v4'

          RELEASE='trixie'

          DEPLOY_COMPRESSION='zip'
          COMPRESSION_LEVEL='6'

          EXPORT_LAST_STAGE_ONLY=1

          ENABLE_SSH=1

          FIRST_USER_NAME='admin'
          FIRST_USER_PASS='admin'

          DISABLE_FIRST_BOOT_USER_RENAME=1

          TIMEZONE_DEFAULT='Asia/Manila'
          WPA_COUNTRY='PH'

          STAGE_LIST='stage0 stage1 stage2 ../custom-stage'
          EOF

      - name: Build pi-gen
        shell: bash
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64
        run: |
          set -eux

          cd pi-gen

          chmod +x build-docker.sh
          chmod +x build.sh

          echo "================================="
          echo " Docker platform:"
          echo " $DOCKER_DEFAULT_PLATFORM"
          echo "================================="

          docker version

          ./build-docker.sh

      - name: List generated files
        if: always()
        shell: bash
        run: |
          echo "===== pi-gen deploy ====="

          if [ -d pi-gen/deploy ]; then
            ls -lah pi-gen/deploy
          else
            echo "No deploy directory."
          fi

      - name: Upload HotspotOS image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HotspotOS-Test-v4
          path: pi-gen/deploy/*
          if-no-files-found: error
