name: Build HotspotOS Test v3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build host
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          # Remove conflicting old QEMU packages first
          sudo apt-get remove -y \
            qemu-user-static \
            qemu-user-binfmt \
            qemu-user \
            qemu-user-static:armhf \
            qemu-user-static:arm64 \
            || true

          sudo apt-get autoremove -y || true

          sudo apt-get update

          # Install only the current package required by pi-gen
          sudo apt-get install -y \
            qemu-user-binfmt \
            binfmt-support \
            debootstrap \
            quilt \
            parted \
            zerofree \
            zip \
            dosfstools \
            e2fsprogs \
            libarchive-tools \
            libcap2-bin \
            grep \
            rsync \
            xz-utils \
            file \
            git \
            curl \
            bc \
            gpg \
            pigz \
            xxd \
            arch-test \
            bmap-tools \
            kmod

          sudo update-binfmts --enable || true

          git --version
          qemu-arm --version || true

      - name: Create HotspotOS custom stage
        shell: bash
        run: |
          set -eux

          rm -rf custom-stage
          mkdir -p custom-stage/01-hotspot

          cat > custom-stage/01-hotspot/00-run.sh <<'EOF'
          #!/bin/bash
          set -e

          echo "HotspotOS custom stage"
          echo "HotspotOS installation started."

          mkdir -p "${ROOTFS_DIR}/etc/hotspotos"

          cat > "${ROOTFS_DIR}/etc/hotspotos/version" <<'EOV'
          HotspotOS Test v3
          EOV
          EOF

          chmod +x custom-stage/01-hotspot/00-run.sh

          touch custom-stage/EXPORT_IMAGE

      - name: Build Raspberry Pi OS Lite 32-bit
        uses: usimd/pi-gen-action@v1
        with:
          image-name: HotspotOS-Test-v3
          pi-gen-version: master
          release: trixie
          stage-list: stage0 stage1 stage2 ./custom-stage
          compression: zip
          compression-level: 6
          export-last-stage-only: true

          enable-cloud-init: 0
          enable-ssh: 1

          username: admin
          password: admin
          disable-first-boot-user-rename: 1

          timezone: Asia/Manila
          wpa-country: PH

          verbose-output: true

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: HotspotOS-Test-v3
          path: pi-gen/deploy/*
          if-no-files-found: error
